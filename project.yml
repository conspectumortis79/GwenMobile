name: GwenMobile
options:
  bundleIdPrefix: com.mortis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
schemes:
  GwenMobile:
    build:
      targets:
        GwenMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GwenMobileTests
targets:
  GwenMobile:
    type: application
    platform: iOS
    sources:
      - GwenMobile
    settings:
      base:
        INFOPLIST_FILE: GwenMobile/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mortis.gwenmobile
        PRODUCT_NAME: GwenMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HDR2ZP983J
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"

  GwenMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GwenMobileTests
    dependencies:
      - target: GwenMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: HDR2ZP983J
        TARGETED_DEVICE_FAMILY: "1,2"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GwenMobile.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GwenMobile"
